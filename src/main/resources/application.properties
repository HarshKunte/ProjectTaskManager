spring.application.name=taskmanager

spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtcGxlYXNlISE
app.jwt.expirationMs=3600000
app.storage.upload-dir=uploads
app.storage.max-file-size-bytes: 10485760
app.storage.max-files-per-task: 10
app.storage.allowed-content-types=image/png,image/jpeg,image/gif,application/pdf,text/plain,application/zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# ===== AI =====
# Set ANTHROPIC_API_KEY as an environment variable; leave the default empty
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-sonnet-4-6}